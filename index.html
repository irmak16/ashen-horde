<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashen Horde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="hurt"></div>
    <div id="hud" class="hidden">
      <div id="xp"><div id="xpfill"></div><span id="lvl">NV 1</span></div>
      <div id="timer">00:00</div>
      <div id="stats"><span id="kills" title="Öldürme">☠ 0</span><span id="gold" title="Altın">¤ 0</span></div>
      <div id="slots"><div id="wslots"></div><div id="pslots"></div></div>
      <div id="bossbar" class="hidden"><div id="bossname"></div><div class="bar"><div id="bossfill"></div></div></div>
      <div id="bossptr" class="hidden"></div>
      <div id="chesthint" class="hidden">✦ Evrim hazır — bir boss sandığı bul</div>
    </div>
    <div id="banner"></div>
    <div id="screens"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
